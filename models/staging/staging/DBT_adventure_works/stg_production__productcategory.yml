version: 2

models:
  - name: stg_production__productcategory
    description: Staging da tabela production_productcategory da Adventure Works.

    columns:
      - name: product_category_id
        description: Chave primária da tabela de categoria do produto.
        tests:
          - not_null
          - unique

      - name: category_name
        description: Nome da categoria do produto.
        tests:
          - not_null