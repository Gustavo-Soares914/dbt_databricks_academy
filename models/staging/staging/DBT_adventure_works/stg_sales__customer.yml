version: 2

models:
  - name: stg_sales__customer
    description: Staging da tabela sales_customer da Adventure Works.

    columns:
      - name: customer_id
        description: Chave primária da tabela de clientes.
        tests:
          - not_null
          - unique

      - name: person_id
        description: ID da pessoa.
        tests:
          - unique

      - name: territory_id_pk
        description: Chave secundária para conectar com a tabela stg_sales__salesterritory.
        tests:
          - not_null