version: 2

models:
  - name: stg_production__productsubcategory
    description: Staging da tabela production_productsubcategory da Adventure Works.

    columns:
      - name: subcategory_id
        description: Chave primária da tabela de subcategoria do produto.
        tests:
          - not_null
          - unique

      - name: category_id
        description: Chave secundária para conectar na tabela stg_production__productcategory.
        tests:
          - not_null

      - name: subcategory_name
        description: Nome da subcategoria do produto.
        tests:
          - not_null